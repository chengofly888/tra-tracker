<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>台鐵列車即時追蹤地圖</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --bg:#0c1118; --panel:#141b26; --panel2:#1b2432; --line:#2a3545;
    --fg:#e8edf4; --fg-dim:#8fa0b5; --accent:#ff7a1a; --accent2:#ffb347;
    --ok:#3ecf8e; --warn:#ffcc4d; --err:#ff5d5d; --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;}
  body{display:flex;flex-direction:column;}
  header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;background:var(--panel);}
  header h1{font-size:17px;margin:0;letter-spacing:.3px;}
  header h1 b{color:var(--accent);font-weight:800;}
  header .sub{font-size:12px;color:var(--fg-dim);}
  #layout{flex:1;display:flex;min-height:0;}
  #sidebar{width:360px;min-width:300px;max-width:420px;border-right:1px solid var(--line);
    background:var(--panel);display:flex;flex-direction:column;overflow:auto;}
  #map{flex:1;min-width:0;background:#0a0e14;}
  .section{padding:14px 16px;border-bottom:1px solid var(--line);}
  .section h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--fg-dim);margin:0 0 10px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .section h2 .cap{font-weight:400;text-transform:none;letter-spacing:0;color:#50607a;font-size:11px;}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:7px;}
  .row label{width:58px;flex:none;font-size:12px;color:var(--fg-dim);font-family:var(--mono);}
  input[type=text],input[type=password]{
    flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--fg);
    border-radius:7px;padding:7px 9px;font-size:13px;font-family:var(--mono);
  }
  input::placeholder{color:#50607a;}
  input:focus{outline:none;border-color:var(--accent);}
  .toggle-eye{flex:none;background:none;border:none;color:var(--fg-dim);cursor:pointer;font-size:13px;padding:4px;}
  .rm-btn{flex:none;background:none;border:1px solid var(--line);color:var(--fg-dim);cursor:pointer;
    font-size:13px;width:26px;height:26px;border-radius:6px;line-height:1;}
  .rm-btn:hover{border-color:var(--err);color:var(--err);}
  .add-row-btn{width:100%;background:var(--panel2);border:1px dashed var(--line);color:var(--accent2);
    border-radius:8px;padding:8px;font-size:12px;cursor:pointer;margin-top:4px;font-weight:600;}
  .add-row-btn:hover{border-color:var(--accent);}
  .add-row-btn:disabled{opacity:.35;cursor:not-allowed;color:var(--fg-dim);}

  /* one key = one card holding ClientId + ClientSecret together */
  .keygroup{background:var(--panel2);border:1px solid var(--line);border-radius:9px;
    padding:9px 10px 10px;margin-bottom:9px;border-left:3px solid #555;transition:border-color .2s;}
  .keygroup.active{border-left-color:var(--ok);}
  .keygroup.dead{border-left-color:var(--err);}
  .keygroup-head{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .keygroup-head .idx{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--fg-dim);flex:1;}
  .keygroup.active .keygroup-head .idx{color:var(--ok);}
  .keygroup.dead .keygroup-head .idx{color:var(--err);}
  .keygroup-head .tag{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:4px;
    background:#123;color:var(--ok);display:none;}
  .keygroup.active .tag.active{display:inline-block;}
  .keygroup.dead .tag.dead{display:inline-block;background:#3a1414;color:var(--err);}
  .keygroup .row{margin-bottom:6px;}
  .keygroup .row:last-child{margin-bottom:0;}

  .btnrow{display:flex;gap:8px;margin-top:10px;}
  button.main{flex:1;background:var(--accent);color:#1a0d00;border:none;border-radius:8px;
    padding:10px;font-weight:700;font-size:13px;cursor:pointer;}
  button.main.stop{background:var(--err);color:#200;}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg-dim);
    border-radius:8px;padding:10px 12px;font-size:13px;cursor:pointer;}
  button.main:active,button.ghost:active{transform:scale(.98);}
  .hint{font-size:11px;color:var(--fg-dim);line-height:1.5;margin-top:8px;}
  .hint code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-family:var(--mono);}
  #status{flex:1;overflow:auto;}
  .log{font-family:var(--mono);font-size:11px;color:var(--fg-dim);padding:3px 0;border-bottom:1px dashed #1e2733;}
  .log .t{color:#50607a;margin-right:6px;}
  .log.err{color:var(--err);}
  .log.ok{color:var(--ok);}
  #cards{display:flex;flex-direction:column;gap:10px;padding:12px 16px;}
  .card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    border-left:4px solid var(--c,#555);}
  .card .no{font-family:var(--mono);font-weight:800;font-size:15px;color:var(--c,#fff);}
  .card .st{font-size:13px;margin-top:3px;}
  .card .meta{font-size:11px;color:var(--fg-dim);margin-top:4px;font-family:var(--mono);}
  .card .delay{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;font-size:11px;font-family:var(--mono);}
  .delay.ok{background:#123; color:var(--ok);}
  .delay.late{background:#3a1a00;color:var(--warn);}
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,#999);
    margin-right:6px;box-shadow:0 0 0 0 var(--c,#999);animation:pulse 1.6s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--c,#999) 60%, transparent)}
    70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
  .train-dot{border-radius:50%;border:2px solid #fff;box-shadow:0 0 6px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);
    font-weight:800;font-size:10px;}
  .leaflet-container{background:#0a0e14;}
  @media (max-width:760px){
    #layout{flex-direction:column;}
    #sidebar{width:100%;max-width:none;max-height:52vh;}
    #map{min-height:48vh;}
  }
</style>
</head>
<body>
<header>
  <h1><b>台鐵</b> 列車即時位置追蹤</h1>
  <span class="sub">最多 5 班次 · TDX 開放資料 · 本機瀏覽器執行</span>
</header>

<div id="layout">
  <div id="sidebar">

    <div class="section">
      <h2>追蹤車次 <span class="cap" id="trainCap">1 / 5</span></h2>
      <div id="trainInputs"></div>
      <button type="button" class="add-row-btn" id="addTrainBtn">＋ 新增車次</button>
      <div class="hint">輸入台鐵車次號碼，例如 <code>123</code>、<code>1234</code>。</div>
    </div>

    <div class="section">
      <h2>TDX API 金鑰 <span class="cap" id="keyCap">1 / 5</span></h2>
      <div id="keyInputs"></div>
      <button type="button" class="add-row-btn" id="addKeyBtn">＋ 新增一組金鑰</button>
      <div class="hint">
        每組請分別輸入 <code>Client Id</code> 與 <code>Client Secret</code>（TDX 會員中心「API金鑰」頁可取得）。
        系統會從第 1 組開始取得授權，若該組失效（401/403）會自動換下一組，直到成功或全部失敗為止。
        金鑰僅儲存在你本機瀏覽器（localStorage），不會上傳到任何第三方。
      </div>
      <div class="btnrow">
        <button class="main" id="startBtn">開始追蹤</button>
        <button class="ghost" id="clearBtn">清除紀錄</button>
      </div>
    </div>

    <div class="section" id="cardsSection" style="display:none;">
      <h2>車次狀態</h2>
      <div id="cards"></div>
    </div>

    <div class="section" style="flex:1;display:flex;flex-direction:column;min-height:120px;">
      <h2>系統紀錄</h2>
      <div id="status"></div>
    </div>
  </div>

  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  "use strict";

  // ---------- constants ----------
  var AUTH_URL = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
  var BASE = "https://tdx.transportdata.tw/api/basic";
  var STATION_URL = BASE + "/v2/Rail/TRA/Station?$format=JSON";
  // Candidate live-position endpoints, tried in order per train until one works.
  // TDX's live train-position dataset has been served under a couple of different
  // path/version spellings over time, so we probe them instead of hardcoding one.
  function liveCandidates(trainNo){
    var n = encodeURIComponent(trainNo);
    return [
      BASE + "/v2/Rail/TRA/TrainLiveBoard/TrainNo/" + n + "?$format=JSON",
      BASE + "/v2/Rail/TRA/TrainLiveBoard?$filter=TrainNo%20eq%20'" + n + "'&$format=JSON",
      BASE + "/v3/Rail/TRA/TrainLiveBoard?$filter=TrainNo%20eq%20'" + n + "'&$format=JSON",
      BASE + "/v2/Rail/TRA/LiveBoard?$filter=TrainNo%20eq%20'" + n + "'&$format=JSON"
    ];
  }
  var COLORS = ["#ff7a1a","#3ecf8e","#4da6ff","#ff5d9e","#ffd23f"];
  // TDX's own response tells us how often ITS data actually refreshes: the
  // envelope carries UpdateInterval:30 (seconds), so match that exactly —
  // polling faster just re-fetches an unchanged reading. The illusion of
  // continuous motion between those real updates comes from the
  // dead-reckoning glide below, not from polling faster than the source.
  var POLL_MS = 30000;
  var MAX_TRAINS = 5;
  var MAX_KEYS = 5;

  // ---------- state ----------
  var keyWorkingIndex = 0;      // which key slot currently works, by DOM position
  var token = null, tokenExpiry = 0;
  var stationById = {};         // StationID -> {name, lat, lon}
  var liveEndpointWinner = {};  // trainNo -> url template index that worked last time
  var trainState = {};          // trainNo -> {stationId, nextStationId, delay, updateTime, marker, ...}
  var pollTimer = null;
  var running = false;
  var rowSeq = 0;                // unique id generator for dynamically added rows

  // ---------- small utils ----------
  function $(id){ return document.getElementById(id); }
  function nowStr(){
    var d = new Date();
    return d.toTimeString().slice(0,8);
  }
  function log(msg, cls){
    var el = document.createElement("div");
    el.className = "log" + (cls ? " " + cls : "");
    el.innerHTML = '<span class="t">'+nowStr()+'</span>' + msg;
    var box = $("status");
    box.insertBefore(el, box.firstChild);
    while(box.children.length > 120) box.removeChild(box.lastChild);
  }
  function pick(obj, candidates){
    if(!obj) return undefined;
    for(var i=0;i<candidates.length;i++){
      if(obj[candidates[i]] !== undefined && obj[candidates[i]] !== null) return obj[candidates[i]];
    }
    var keys = Object.keys(obj);
    for(var c=0;c<candidates.length;c++){
      var cand = candidates[c].toLowerCase();
      for(var k=0;k<keys.length;k++){
        if(keys[k].toLowerCase() === cand) return obj[keys[k]];
      }
    }
    return undefined;
  }
  function zh(nameObj){
    if(!nameObj) return "";
    if(typeof nameObj === "string") return nameObj;
    return nameObj.Zh_tw || nameObj.Zh_Tw || nameObj.zh_tw || nameObj.En || "";
  }
  function esc(s){
    return String(s==null?"":s).replace(/"/g,"&quot;");
  }

  // ---------- dynamic train rows ----------
  function trainRows(){ return Array.prototype.slice.call(document.querySelectorAll("#trainInputs .row")); }

  function renumberTrains(){
    var rows = trainRows();
    rows.forEach(function(row, i){
      row.querySelector("label").textContent = "車次 " + (i+1);
    });
    $("trainCap").textContent = rows.length + " / " + MAX_TRAINS;
    $("addTrainBtn").disabled = rows.length >= MAX_TRAINS;
  }

  function addTrainRow(value){
    if(trainRows().length >= MAX_TRAINS) return;
    rowSeq++;
    var row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<label>車次</label>' +
      '<input type="text" class="train-input" placeholder="例如 123" inputmode="numeric" value="'+esc(value)+'">' +
      '<button type="button" class="rm-btn" title="移除">×</button>';
    row.querySelector(".rm-btn").addEventListener("click", function(){
      row.remove();
      renumberTrains();
    });
    $("trainInputs").appendChild(row);
    renumberTrains();
  }

  $("addTrainBtn").addEventListener("click", function(){ addTrainRow(""); });

  // ---------- dynamic key groups (ClientId + ClientSecret together) ----------
  function keyGroups(){ return Array.prototype.slice.call(document.querySelectorAll("#keyInputs .keygroup")); }

  function renumberKeys(){
    var groups = keyGroups();
    groups.forEach(function(g, i){
      g.querySelector(".idx").textContent = "金鑰 " + (i+1);
    });
    $("keyCap").textContent = groups.length + " / " + MAX_KEYS;
    $("addKeyBtn").disabled = groups.length >= MAX_KEYS;
  }

  function addKeyGroup(idVal, secretVal){
    if(keyGroups().length >= MAX_KEYS) return;
    rowSeq++;
    var g = document.createElement("div");
    g.className = "keygroup";
    g.innerHTML =
      '<div class="keygroup-head">' +
        '<span class="idx">金鑰</span>' +
        '<span class="tag active">使用中</span>' +
        '<span class="tag dead">已失效</span>' +
        '<button type="button" class="rm-btn" title="移除">×</button>' +
      '</div>' +
      '<div class="row"><label>Client Id</label>' +
        '<input type="text" class="key-id" placeholder="Client Id" value="'+esc(idVal)+'"></div>' +
      '<div class="row"><label>Secret</label>' +
        '<input type="password" class="key-secret" placeholder="Client Secret" value="'+esc(secretVal)+'">' +
        '<button type="button" class="toggle-eye">👁</button></div>';
    g.querySelector(".rm-btn").addEventListener("click", function(){
      g.remove();
      renumberKeys();
    });
    g.querySelector(".toggle-eye").addEventListener("click", function(){
      var inp = g.querySelector(".key-secret");
      inp.type = inp.type === "password" ? "text" : "password";
    });
    $("keyInputs").appendChild(g);
    renumberKeys();
  }

  $("addKeyBtn").addEventListener("click", function(){ addKeyGroup("",""); });

  // ---------- local persistence (convenience only) ----------
  function loadSaved(){
    try{
      var t = JSON.parse(localStorage.getItem("tra_tracker_trains") || "[]");
      var k = JSON.parse(localStorage.getItem("tra_tracker_keys") || "[]");
      return {trains:t, keys:k};
    }catch(e){ return {trains:[], keys:[]}; }
  }
  function saveState(){
    try{
      var trains = trainRows().map(function(r){ return r.querySelector(".train-input").value.trim(); });
      var keys = keyGroups().map(function(g){
        return {id: g.querySelector(".key-id").value.trim(), secret: g.querySelector(".key-secret").value.trim()};
      });
      localStorage.setItem("tra_tracker_trains", JSON.stringify(trains));
      localStorage.setItem("tra_tracker_keys", JSON.stringify(keys));
    }catch(e){}
  }

  // ---------- build initial rows ----------
  (function buildInputs(){
    var saved = loadSaved();
    if(saved.trains.length){
      saved.trains.slice(0, MAX_TRAINS).forEach(function(v){ addTrainRow(v); });
    } else {
      addTrainRow("");
    }
    if(saved.keys.length){
      saved.keys.slice(0, MAX_KEYS).forEach(function(k){ addKeyGroup(k.id||"", k.secret||""); });
    } else {
      addKeyGroup("","");
    }
  })();

  // ---------- map ----------
  var map = L.map("map", {zoomControl:true}).setView([23.6, 121.0], 7);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  var glideLines = {}; // trainNo -> polyline

  function ensureMarker(trainNo, color){
    if(trainState[trainNo].marker) return trainState[trainNo].marker;
    var icon = L.divIcon({
      className: "",
      html: '<div class="train-dot" style="width:26px;height:26px;background:'+color+';position:relative;">'+trainNo+'</div>',
      iconSize: [26,26], iconAnchor:[13,13]
    });
    var m = L.marker([23.6,121.0], {icon: icon}).addTo(map);
    trainState[trainNo].marker = m;
    return m;
  }

  // ---------- dead-reckoning between polls ----------
  // TDX only tells us which station a train is at (or last reported) every
  // ~25-60s; it gives no continuous GPS. To avoid the dot sitting still and
  // then jumping, we estimate the train's speed from how fast it actually
  // covered the previous station-to-station segment, then keep sliding the
  // dot toward the next station at that estimated pace every animation
  // frame, in between polls. A fresh poll either confirms arrival (resets
  // the segment and refines the speed estimate) or, if the train is still
  // between the same two stations, just lets the existing glide continue.
  var EARTH_R = 6371000;
  var DEFAULT_SPEED_MPS = 16.7;      // ~60km/h, used only until a real segment is measured
  var MIN_SPEED_MPS = 3;             // ~11km/h floor
  var MAX_SPEED_MPS = 42;            // ~150km/h ceiling, generous for TRA
  var MAX_SEGMENT_FRACTION = 0.97;   // never let the dot reach the next station on its own; a poll must confirm it

  function haversineMeters(a, b){
    var toRad = function(d){ return d * Math.PI / 180; };
    var dLat = toRad(b.lat - a.lat), dLon = toRad(b.lon - a.lon);
    var lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    var h = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2 * EARTH_R * Math.asin(Math.min(1, Math.sqrt(h)));
  }

  // Called whenever a poll confirms a station fix. Decides whether this is
  // a new segment (station advanced -> measure real speed from the last
  // segment) or the same segment continuing (just let the glide keep going).
  function updateDeadReckoning(trainNo, info, cur, target){
    var st = trainState[trainNo];
    var nowT = Date.now();
    if(!st.segStart){
      st.lastConfirmedStationId = info.stationId;
      st.segStart = {lat: cur.lat, lon: cur.lon, t: nowT};
      st.segEnd = target ? {lat: target.lat, lon: target.lon} : {lat: cur.lat, lon: cur.lon};
      st.estSpeedMps = DEFAULT_SPEED_MPS;
      ensureMarker(trainNo, st.color).setLatLng([cur.lat, cur.lon]);
      return;
    }
    if(info.stationId !== st.lastConfirmedStationId){
      // station advanced since the last poll: measure how fast it actually
      // covered that ground and fold it into the speed estimate (smoothed,
      // so one noisy reading doesn't swing the pace wildly)
      var elapsedSec = Math.max(1, (nowT - st.segStart.t) / 1000);
      var distM = haversineMeters(st.segStart, {lat: cur.lat, lon: cur.lon});
      var measured = distM / elapsedSec;
      var blended = st.estSpeedMps ? (st.estSpeedMps * 0.4 + measured * 0.6) : measured;
      st.estSpeedMps = Math.min(MAX_SPEED_MPS, Math.max(MIN_SPEED_MPS, blended));
      st.lastConfirmedStationId = info.stationId;
      st.segStart = {lat: cur.lat, lon: cur.lon, t: nowT};
      st.segEnd = target ? {lat: target.lat, lon: target.lon} : {lat: cur.lat, lon: cur.lon};
    } else if(target){
      // same segment still in progress: just keep the existing glide's
      // start time/speed as-is, but refresh the target in case the
      // "next station" field itself changed (e.g. direction correction)
      st.segEnd = {lat: target.lat, lon: target.lon};
    }
  }

  var rafRunning = false;
  function driveDeadReckoning(){
    Object.keys(trainState).forEach(function(no){
      var st = trainState[no];
      if(!st || !st.marker || !st.segStart || !st.segEnd) return;
      var totalDist = haversineMeters(st.segStart, st.segEnd);
      if(totalDist < 5){ return; } // already there / no known next station
      var elapsedSec = (Date.now() - st.segStart.t) / 1000;
      var traveled = (st.estSpeedMps || DEFAULT_SPEED_MPS) * elapsedSec;
      var frac = Math.min(traveled / totalDist, MAX_SEGMENT_FRACTION);
      var lat = st.segStart.lat + (st.segEnd.lat - st.segStart.lat) * frac;
      var lon = st.segStart.lon + (st.segEnd.lon - st.segStart.lon) * frac;
      st.marker.setLatLng([lat, lon]);
    });
    if(rafRunning) requestAnimationFrame(driveDeadReckoning);
  }
  function startDeadReckoning(){
    if(rafRunning) return;
    rafRunning = true;
    requestAnimationFrame(driveDeadReckoning);
  }
  function stopDeadReckoning(){
    rafRunning = false;
  }

  // ---------- TDX auth ----------
  function getActiveKeys(){
    // returns array aligned 1:1 with keyGroups() DOM order; null where a group is incomplete
    return keyGroups().map(function(g){
      var id = g.querySelector(".key-id").value.trim();
      var secret = g.querySelector(".key-secret").value.trim();
      if(!id || !secret) return null;
      return {id:id, secret:secret};
    });
  }

  function markBadge(i, state){
    var groups = keyGroups();
    groups.forEach(function(g, j){
      g.classList.remove("active","dead");
      if(j === i && state === "active") g.classList.add("active");
      if(j === i && state === "dead") g.classList.add("dead");
    });
  }

  function authWithKey(keyObj){
    var body = "grant_type=client_credentials&client_id=" + encodeURIComponent(keyObj.id) +
               "&client_secret=" + encodeURIComponent(keyObj.secret);
    return fetch(AUTH_URL, {
      method: "POST",
      headers: {"Content-Type": "application/x-www-form-urlencoded"},
      body: body
    }).then(function(res){
      if(!res.ok){
        return res.text().then(function(txt){
          var detail = "HTTP " + res.status;
          try{
            var j = JSON.parse(txt);
            if(j.error) detail = j.error + (j.error_description ? ": " + j.error_description : "");
          }catch(e){
            if(txt) detail += " " + txt.slice(0,120);
          }
          throw new Error(detail);
        });
      }
      return res.json();
    });
  }

  // Try keys starting at keyWorkingIndex, rolling forward through all groups on failure.
  function getToken(){
    if(token && Date.now() < tokenExpiry - 60000){
      return Promise.resolve(token);
    }
    var keys = getActiveKeys();
    var total = keys.length;
    var startAt = Math.min(keyWorkingIndex, Math.max(total-1,0));
    function attempt(offset){
      if(offset >= total){
        return Promise.reject(new Error("所有 " + total + " 組 TDX 金鑰都無法授權，請檢查金鑰內容。"));
      }
      var i = (startAt + offset) % total;
      var k = keys[i];
      if(!k){
        return attempt(offset+1);
      }
      return authWithKey(k).then(function(data){
        token = data.access_token;
        tokenExpiry = Date.now() + (data.expires_in ? data.expires_in*1000 : 3600000);
        keyWorkingIndex = i;
        markBadge(i, "active");
        log("使用金鑰 " + (i+1) + " 取得授權成功。", "ok");
        return token;
      }).catch(function(err){
        markBadge(i, "dead");
        log("金鑰 " + (i+1) + " 授權失敗（" + err.message + "），改用下一組。", "err");
        return attempt(offset+1);
      });
    }
    if(total === 0){
      return Promise.reject(new Error("尚未輸入任何金鑰。"));
    }
    return attempt(0);
  }

  function authedFetch(url){
    return getToken().then(function(tok){
      return fetch(url, {headers: {"Authorization": "Bearer " + tok}});
    }).then(function(res){
      if(res.status === 401 || res.status === 403){
        // current key just got rejected on a data call — rotate and retry once
        var total = getActiveKeys().length || 1;
        token = null;
        keyWorkingIndex = (keyWorkingIndex + 1) % total;
        log("目前金鑰於資料查詢被拒，切換下一組重試。", "err");
        return getToken().then(function(tok2){
          return fetch(url, {headers:{"Authorization":"Bearer "+tok2}});
        });
      }
      return res;
    });
  }

  // ---------- station static data ----------
  function loadStations(){
    log("載入台鐵車站座標資料…");
    return authedFetch(STATION_URL).then(function(res){
      if(!res.ok) throw new Error("station_http_" + res.status);
      return res.json();
    }).then(function(arr){
      if(!Array.isArray(arr)) throw new Error("station_bad_shape");
      arr.forEach(function(s){
        var id = pick(s, ["StationID"]);
        var pos = pick(s, ["StationPosition"]) || {};
        var lon = pick(pos, ["PositionLon"]);
        var lat = pick(pos, ["PositionLat"]);
        var name = zh(pick(s, ["StationName"]));
        if(id && lat && lon){
          stationById[String(id)] = {name:name, lat:parseFloat(lat), lon:parseFloat(lon)};
        }
      });
      log("車站座標載入完成，共 " + Object.keys(stationById).length + " 站。", "ok");
    }).catch(function(err){
      log("車站資料載入失敗：" + err.message, "err");
      throw err;
    });
  }

  // ---------- live position polling ----------
  // TDX wraps several of its rail endpoints in an envelope object
  // ({UpdateTime, ..., TrainLiveBoards:[...]}) rather than returning a bare
  // array, and the wrapper's array key varies by endpoint/version. Unwrap
  // whichever shape comes back instead of assuming one.
  function extractRows(data){
    if(Array.isArray(data)) return data;
    if(!data || typeof data !== "object") return [];
    var wrapKeys = ["TrainLiveBoards","LiveBoards","TrainLiveBoard","LiveBoard","TrainLiveBoardList"];
    for(var i=0;i<wrapKeys.length;i++){
      if(Array.isArray(data[wrapKeys[i]])) return data[wrapKeys[i]];
    }
    // a handful of endpoints return one row as a bare object with no wrapper
    if(data.TrainNo !== undefined || data.StationID !== undefined || data.TrainStationID !== undefined){
      return [data];
    }
    return [];
  }

  // Some TRA rolling stock reports real onboard GPS via a separate TDX
  // endpoint (TrainLivePosition) rather than just a current-station board.
  // When it's available for a train, it's strictly better than the
  // timetable-based estimate below, so try it first and fall back
  // gracefully when a train has none.
  function gpsCandidates(trainNo){
    var n = encodeURIComponent(trainNo);
    return [
      BASE + "/v3/Rail/TRA/TrainLivePosition/TrainNo/" + n + "?$format=JSON",
      BASE + "/v3/Rail/TRA/TrainLivePosition?$filter=TrainNo%20eq%20'" + n + "'&$format=JSON"
    ];
  }
  function extractGpsFix(row){
    if(!row) return null;
    var lat = pick(row, ["PositionLat","Latitude","Lat","GPSLat"]);
    var lon = pick(row, ["PositionLon","Longitude","Lon","GPSLon"]);
    if(lat == null || lon == null) return null;
    lat = parseFloat(lat); lon = parseFloat(lon);
    if(!isFinite(lat) || !isFinite(lon) || (lat === 0 && lon === 0)) return null;
    return {lat: lat, lon: lon};
  }
  function fetchGpsPosition(trainNo){
    var cands = gpsCandidates(trainNo);
    var lastRaw = null;
    function attempt(k){
      if(k >= cands.length){
        var e = new Error("gps_not_available");
        e.raw = lastRaw;
        return Promise.reject(e);
      }
      return authedFetch(cands[k]).then(function(res){
        if(!res.ok) return attempt(k+1);
        return res.json().then(function(data){
          var rows = extractRows(data);
          if(!rows.length){ lastRaw = data; return attempt(k+1); }
          var fix = extractGpsFix(rows[0]);
          if(!fix){ lastRaw = rows[0]; return attempt(k+1); }
          return fix;
        }).catch(function(){ return attempt(k+1); });
      }).catch(function(){ return attempt(k+1); });
    }
    return attempt(0);
  }
  // Fires on every poll; cheap to keep retrying even after a miss, since a
  // train could gain/lose GPS coverage. Only logs the "unsupported" state
  // once per train to avoid spamming the log every 30s.
  function tryGpsFix(trainNo, color){
    fetchGpsPosition(trainNo).then(function(fix){
      var st = trainState[trainNo];
      if(!st) return;
      if(!st.gpsConfirmedLogged){
        st.gpsConfirmedLogged = true;
        log("車次 " + trainNo + "：偵測到車載 GPS 資料，改用真實座標（比時刻表推算更準確）。", "ok");
      }
      var nowT = Date.now();
      var prev = st.lastGpsFix;
      if(prev){
        var distM = haversineMeters(prev, fix);
        var dt = Math.max(1, (nowT - prev.t) / 1000);
        var measured = distM / dt;
        st.estSpeedMps = Math.min(MAX_SPEED_MPS, Math.max(MIN_SPEED_MPS,
          st.estSpeedMps ? (st.estSpeedMps * 0.3 + measured * 0.7) : measured));
      }
      st.lastGpsFix = {lat: fix.lat, lon: fix.lon, t: nowT};
      st.segStart = {lat: fix.lat, lon: fix.lon, t: nowT};
      if(!st.segEnd) st.segEnd = {lat: fix.lat, lon: fix.lon};
      ensureMarker(trainNo, st.color || color).setLatLng([fix.lat, fix.lon]);
    }).catch(function(err){
      var st = trainState[trainNo];
      if(st && !st.gpsDebugLogged){
        st.gpsDebugLogged = true;
        log("車次 " + trainNo + "：此車次目前無車載 GPS 資料（" + err.message + "），改用時刻表推算位置。", "err");
        if(err.raw){
          try{
            log("車次 " + trainNo + " GPS 原始回應：<br><span style=\"word-break:break-all;color:#8fa0b5;\">" +
                JSON.stringify(err.raw).replace(/</g,"&lt;").slice(0,1500) + "</span>", "err");
          }catch(e){}
        }
      }
    });
  }

  function tryLiveEndpoints(trainNo){
    var cands = liveCandidates(trainNo);
    var preferred = liveEndpointWinner[trainNo];
    var order = cands.map(function(_,i){return i;});
    if(preferred !== undefined){
      order = [preferred].concat(order.filter(function(i){return i!==preferred;}));
    }
    var sawEmptyBoard = false; // endpoint answered fine, just no active train right now
    function attempt(k){
      if(k >= order.length){
        var e = new Error(sawEmptyBoard ? "no_live_data" : "no_endpoint_worked");
        return Promise.reject(e);
      }
      var idx = order[k];
      return authedFetch(cands[idx]).then(function(res){
        if(!res.ok) return attempt(k+1);
        return res.json().then(function(data){
          var rows = extractRows(data);
          if(rows.length === 0){
            if(data && typeof data === "object" && !Array.isArray(data)) sawEmptyBoard = true;
            return attempt(k+1);
          }
          liveEndpointWinner[trainNo] = idx;
          return rows;
        }).catch(function(){ return attempt(k+1); });
      }).catch(function(){ return attempt(k+1); });
    }
    return attempt(0);
  }

  function parseRow(row){
    return {
      stationId: String(pick(row, ["StationID","TrainStationID","NowStationID"]) || ""),
      stationName: zh(pick(row, ["StationName","TrainStationName","NowStationName"])),
      nextStationId: String(pick(row, ["NextStationID"]) || ""),
      endingStationId: String(pick(row, ["EndingStationID"]) || ""),
      endingStationName: zh(pick(row, ["EndingStationName"])),
      delay: pick(row, ["DelayTime","Delay"]) || 0,
      updateTime: pick(row, ["UpdateTime","SrcUpdateTime"]) || "",
      direction: pick(row, ["Direction"])
    };
  }

  // ---------- timetable (to derive "next station" ourselves) ----------
  // Confirmed from real device testing: TDX's live-board row for this train
  // type carries NO next-station field at all (just TrainNo/StationID/
  // StationName/DelayTime/UpdateTime/...). So "next station" has to be
  // worked out from the train's own stop sequence: fetch its timetable
  // once, find where the currently-reported station sits in that ordered
  // list, and the next entry is the next station.
  function todayStr(){
    var d = new Date();
    var pad = function(n){ return n < 10 ? "0"+n : ""+n; };
    return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate());
  }
  function timetableCandidates(trainNo){
    var n = encodeURIComponent(trainNo);
    var d = todayStr();
    return [
      BASE + "/v3/Rail/TRA/DailyTrainTimetable/TrainDate/" + d + "/TrainNo/" + n + "?$format=JSON",
      BASE + "/v2/Rail/TRA/DailyTrainTimetable/TrainDate/" + d + "/TrainNo/" + n + "?$format=JSON",
      BASE + "/v3/Rail/TRA/GeneralTrainTimetable/TrainNo/" + n + "?$format=JSON",
      BASE + "/v2/Rail/TRA/TrainTimetable/TrainDate/" + d + "/TrainNo/" + n + "?$format=JSON"
    ];
  }
  // Unwraps whatever shape the timetable endpoint answers with down to a
  // flat array of stop rows, trying a few likely wrapper/nesting patterns.
  function extractTimetableStops(data){
    var arr = null;
    if(Array.isArray(data)) arr = data;
    else if(data && typeof data === "object"){
      var wrapKeys = ["TrainStopTimes","StopTimes","TimetableTrainInfos","TrainTimetables","StationStopTimes","TrainStationStopTimes"];
      for(var i=0;i<wrapKeys.length;i++){
        if(Array.isArray(data[wrapKeys[i]])){ arr = data[wrapKeys[i]]; break; }
      }
      if(!arr){
        var arrProp = Object.keys(data).filter(function(k){ return Array.isArray(data[k]); })[0];
        if(arrProp) arr = data[arrProp];
      }
    }
    if(!arr || !arr.length) return null;
    // the array might be one-element-per-train, each holding its own nested stop list
    if(!pick(arr[0], ["StationID"])){
      var nestedKey = Object.keys(arr[0]).filter(function(k){ return Array.isArray(arr[0][k]); })[0];
      if(nestedKey) arr = arr[0][nestedKey];
    }
    if(!arr || !arr.length) return null;
    var stops = arr.map(function(row, i){
      var sid = pick(row, ["StationID"]);
      if(sid === undefined){
        var inner = pick(row, ["StopStation","Station"]);
        sid = inner ? pick(inner, ["StationID"]) : undefined;
      }
      return {
        id: String(sid || ""),
        seq: pick(row, ["StopSequence","Sequence","StationSequence"]),
        order: i
      };
    }).filter(function(s){ return s.id; });
    if(!stops.length) return null;
    stops.sort(function(a,b){
      if(a.seq != null && b.seq != null) return a.seq - b.seq;
      return a.order - b.order;
    });
    return stops;
  }
  function fetchTimetable(trainNo){
    var cands = timetableCandidates(trainNo);
    var lastRaw = null;
    function attempt(k){
      if(k >= cands.length){
        var e = new Error("timetable_not_found");
        e.raw = lastRaw;
        return Promise.reject(e);
      }
      return authedFetch(cands[k]).then(function(res){
        if(!res.ok) return attempt(k+1);
        return res.json().then(function(data){
          var stops = extractTimetableStops(data);
          if(!stops){ lastRaw = data; return attempt(k+1); }
          return stops;
        }).catch(function(){ return attempt(k+1); });
      }).catch(function(){ return attempt(k+1); });
    }
    return attempt(0);
  }
  // Kicks off the timetable fetch once per train and caches the result
  // (or the failure) on trainState so pollOne can just read it back.
  function ensureTimetable(trainNo){
    var st = trainState[trainNo];
    if(st.timetableStations || st.timetableFetching || st.timetableFailed) return;
    st.timetableFetching = true;
    fetchTimetable(trainNo).then(function(stops){
      st.timetableStations = stops;
      st.timetableFetching = false;
      log("車次 " + trainNo + "：時刻表載入成功，共 " + stops.length + " 站，之後可推算下一站。", "ok");
    }).catch(function(err){
      st.timetableFetching = false;
      st.timetableFailed = true;
      log("車次 " + trainNo + "：時刻表查詢失敗（" + err.message + "），光點將只在到站時跳動，無法平滑移動。", "err");
      if(err.raw){
        try{
          log("車次 " + trainNo + " 時刻表原始資料：<br><span style=\"word-break:break-all;color:#8fa0b5;\">" +
              JSON.stringify(err.raw).replace(/</g,"&lt;").slice(0,1500) + "</span>", "err");
        }catch(e){}
      }
    });
  }
  function nextStationFromTimetable(trainNo, currentStationId){
    var st = trainState[trainNo];
    if(!st.timetableStations) return null;
    var stops = st.timetableStations;
    var idx = -1;
    for(var i=0;i<stops.length;i++){ if(stops[i].id === currentStationId){ idx = i; break; } }
    if(idx < 0 || idx+1 >= stops.length) return null;
    return stops[idx+1].id;
  }

  function pollOne(trainNo, color){
    return tryLiveEndpoints(trainNo).then(function(rows){
      rows.sort(function(a,b){
        var ta = pick(a,["UpdateTime","SrcUpdateTime"]) || "";
        var tb = pick(b,["UpdateTime","SrcUpdateTime"]) || "";
        return tb.localeCompare(ta);
      });
      var info = parseRow(rows[0]);
      updateTrainCard(trainNo, info, color, null, false, false, rows[0], false);

      var cur = stationById[info.stationId];
      if(!cur){
        log("車次 " + trainNo + "：目前站點座標查無資料（StationID=\"" + info.stationId + "\"）。", "err");
        // debug aid: TDX's exact field names for this endpoint are not guaranteed,
        // so surface the raw row once so the real keys can be read off and the
        // parser fixed, without needing the browser devtools.
        try{
          log("車次 " + trainNo + " 原始資料欄位：" + Object.keys(rows[0]).join(", "), "err");
          var raw = JSON.stringify(rows[0]);
          log("車次 " + trainNo + " 原始 JSON：<br><span style=\"word-break:break-all;color:#8fa0b5;\">" +
              raw.replace(/</g,"&lt;").slice(0,1500) + "</span>", "err");
        }catch(e){}
        return;
      }
      ensureTimetable(trainNo);
      var nextId = nextStationFromTimetable(trainNo, info.stationId);
      var target = nextId ? (stationById[nextId] || null) : null;

      trainState[trainNo].color = color;
      updateDeadReckoning(trainNo, info, cur, target);
      tryGpsFix(trainNo, color); // async: overrides the estimate above with real coords if this train reports GPS

      if(glideLines[trainNo]) map.removeLayer(glideLines[trainNo]);
      if(target){
        glideLines[trainNo] = L.polyline([[cur.lat,cur.lon],[target.lat,target.lon]], {
          color: color, weight: 2, opacity: .5, dashArray: "4,6"
        }).addTo(map);
      }

      trainState[trainNo].lastInfo = info;
      trainState[trainNo].lastSeen = Date.now();
      updateTrainCard(trainNo, info, color, cur, false, false, rows[0], !!target);
      log("車次 " + trainNo + " 更新：" + (cur.name||info.stationId) +
          "，誤點 " + (info.delay||0) + " 分。", "ok");
    }).catch(function(err){
      if(err.message === "no_live_data"){
        log("車次 " + trainNo + " 目前查無即時資料（可能尚未發車、已抵達終點，或今天沒有這個班次）。", "err");
        updateTrainCard(trainNo, null, color, null, false, true);
      } else {
        log("車次 " + trainNo + " 查詢失敗：" + err.message, "err");
        updateTrainCard(trainNo, null, color, null, true);
      }
    });
  }

  function debugDetailsHtml(trainNo, rawRow, hasTarget){
    if(!rawRow) return "";
    var raw = "";
    try{ raw = JSON.stringify(rawRow, null, 1); }catch(e){ raw = String(rawRow); }
    raw = raw.replace(/</g,"&lt;");
    return '<details style="margin-top:6px;">' +
      '<summary style="cursor:pointer;font-size:11px;color:var(--fg-dim);">原始資料／除錯（下一站：' +
      (hasTarget ? '<span style="color:var(--ok)">已解析</span>' : '<span style="color:var(--err)">未知</span>') +
      '）</summary>' +
      '<pre style="white-space:pre-wrap;word-break:break-all;font-size:10px;color:#8fa0b5;' +
      'background:#0c1118;border-radius:6px;padding:6px;margin-top:4px;max-height:160px;overflow:auto;">' +
      raw + '</pre></details>';
  }

  function updateTrainCard(trainNo, info, color, stationObj, failed, noData, rawRow, hasTarget){
    var el = $("card_" + trainNo);
    if(!el){
      el = document.createElement("div");
      el.className = "card";
      el.id = "card_" + trainNo;
      el.style.setProperty("--c", color);
      $("cards").appendChild(el);
    }
    if(failed){
      el.innerHTML = '<div class="no">車次 '+trainNo+'</div><div class="st" style="color:var(--err)">查詢失敗，稍後重試中…</div>' +
        debugDetailsHtml(trainNo, rawRow, hasTarget);
      return;
    }
    if(noData){
      el.innerHTML = '<div class="no">車次 '+trainNo+'</div><div class="st" style="color:var(--fg-dim)">目前查無即時資料（尚未發車／已到站／非今日班次）</div>' +
        debugDetailsHtml(trainNo, rawRow, hasTarget);
      return;
    }
    if(!info){
      el.innerHTML = '<div class="no">車次 '+trainNo+'</div><div class="st">查詢中…</div>';
      return;
    }
    var delayCls = (info.delay && info.delay > 0) ? "late" : "ok";
    var delayTxt = (info.delay && info.delay > 0) ? ("誤點 " + info.delay + " 分") : "準點";
    el.innerHTML =
      '<div class="no"><span class="pulse" style="--c:'+color+'"></span>車次 '+trainNo+'</div>' +
      '<div class="st">目前位置：'+ (info.stationName || stationObj && stationObj.name || info.stationId || "未知") +
      '<span class="delay '+delayCls+'">'+delayTxt+'</span></div>' +
      '<div class="meta">終點：'+(info.endingStationName||"—")+' ・ 更新時間：'+(info.updateTime||"—")+'</div>' +
      debugDetailsHtml(trainNo, rawRow, hasTarget);
  }

  // ---------- polling loop ----------
  function activeTrains(){
    return trainRows().map(function(row, i){
      var v = row.querySelector(".train-input").value.trim();
      return v ? {no:v, color: COLORS[i % COLORS.length]} : null;
    }).filter(Boolean);
  }

  var didInitialFit = false; // only auto-center/zoom once; never fight the user's own pan/zoom afterward

  function pollAll(){
    var trains = activeTrains();
    trains.forEach(function(t){
      if(!trainState[t.no]) trainState[t.no] = {};
      pollOne(t.no, t.color);
    });
    if(trains.length && !didInitialFit){
      var bounds = [];
      trains.forEach(function(t){
        if(trainState[t.no] && trainState[t.no].marker){
          bounds.push(trainState[t.no].marker.getLatLng());
        }
      });
      if(bounds.length){
        map.fitBounds(bounds, {padding:[60,60], maxZoom: 12});
        didInitialFit = true;
      }
    }
  }

  function start(){
    var trains = activeTrains();
    if(trains.length === 0){
      log("請至少輸入一個車次再開始追蹤。", "err");
      return;
    }
    if(getActiveKeys().every(function(k){return !k;})){
      log("請至少輸入一組完整的 TDX 金鑰（Client Id + Client Secret）。", "err");
      return;
    }
    saveState();
    $("cardsSection").style.display = "block";
    $("cards").innerHTML = "";
    trainState = {};
    liveEndpointWinner = {};
    didInitialFit = false;
    running = true;
    $("startBtn").textContent = "停止追蹤";
    $("startBtn").classList.add("stop");
    log("開始追蹤，每 " + Math.round(POLL_MS/1000) + " 秒更新一次。");

    loadStations().then(function(){
      pollAll();
      pollTimer = setInterval(pollAll, POLL_MS);
      startDeadReckoning();
    }).catch(function(){
      running = false;
      $("startBtn").textContent = "開始追蹤";
      $("startBtn").classList.remove("stop");
    });
  }

  function stop(){
    running = false;
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = null;
    stopDeadReckoning();
    $("startBtn").textContent = "開始追蹤";
    $("startBtn").classList.remove("stop");
    log("已停止追蹤。");
  }

  $("startBtn").addEventListener("click", function(){
    if(running) stop(); else start();
  });

  // Mobile browsers throttle/freeze timers for a backgrounded tab to save
  // battery, so a 30s poll can silently stall for minutes while the phone
  // is locked or another app is in front. Catch up immediately instead of
  // waiting for the next scheduled tick whenever the page becomes visible
  // again.
  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && running){
      pollAll();
    }
  });
  $("clearBtn").addEventListener("click", function(){
    $("status").innerHTML = "";
  });

  log("就緒。請輸入車次與 TDX 金鑰後按「開始追蹤」。");
  log("提示：TDX 沒有逐秒 GPS，位置依官方即時到離站資料逐站更新，點位以平滑動畫過渡顯示移動感。", "");
})();
</script>
</body>
</html>
